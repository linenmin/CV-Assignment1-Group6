# exp_050：三项合并版（便于一次跑通）。若需按方向单独消融，请用 exp_051（仅传导式）/ exp_052（仅子中心）/ exp_053（仅双模型级联）。
# exp_050：子中心 prototype + neighborhood_aware（与 exp_047 一致）+ ViT/IR101 双模型级联 + test 传导式簇投票
# ViT 与 exp_047 使用同一 checkpoint（exp_032 best）；IR101 使用 exp_009。

experiment_name: exp_050_transductive_subcenter_cascade_vit032_ir009_neighborhood055_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: vit_base
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_vit_base_webface4m
  freeze_backbone: true
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 1
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 1

augmentation:
  use_horizontal_flip: false

inference:
  mode: transductive_subcenter_cascade
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
  transductive_subcenter_cascade:
    primary_experiment_name: exp_032_vit_adaface_haar_1ep_frozen_prototype_fixed055
    secondary_experiment_name: exp_009_ir101_adaface_haar_10ep_laststage_ft
    k_subcenters: 4
    secondary_confirm_margin: 0.05
    top_k_connect: 25
    sim_connect_threshold: 0.35
    min_cluster_size: 4
    weighted_vote_fraction: 0.72
