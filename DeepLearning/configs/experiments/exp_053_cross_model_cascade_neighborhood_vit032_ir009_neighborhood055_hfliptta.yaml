# 优先级 3 单独消融：ViT + IR101 双模型 neighborhood_aware（均值 prototype）+ 分歧级联；无子中心、无传导式。

experiment_name: exp_053_cross_model_cascade_neighborhood_vit032_ir009_neighborhood055_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: vit_base
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_vit_base_webface4m
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 0
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 1
  learning_rate: 0.0003
  backbone_learning_rate:
  weight_decay: 0.0001
  early_stopping_patience: 1

augmentation:
  use_horizontal_flip: false

inference:
  mode: cross_model_cascade_neighborhood
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
  cross_model_cascade:
    primary_experiment_name: exp_032_vit_adaface_haar_1ep_frozen_prototype_fixed055
    secondary_experiment_name: exp_009_ir101_adaface_haar_10ep_laststage_ft
    secondary_confirm_margin: 0.05
