# exp_048：neighborhood_aware 网格扫描后的保守外推候选。
# 扫描报告：reports/sweeps/neighborhood_aware_grid_latest.json
# 相对 exp_047 (top_k=15, base_weight=0.5)：验证集仍为 0.9375，测试集仅 1 张 2->0（更保守拒识 Mila）。
experiment_name: exp_048_vit_adaface_haar_1ep_frozen_neighborhood_topk5_bw06_fixed055_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: vit_base
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_vit_base_webface4m
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 0
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 1
  learning_rate: 0.0003
  backbone_learning_rate:
  weight_decay: 0.0001
  early_stopping_patience: 1

augmentation:
  use_horizontal_flip: false

inference:
  mode: neighborhood_aware
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 5
    base_weight: 0.6
