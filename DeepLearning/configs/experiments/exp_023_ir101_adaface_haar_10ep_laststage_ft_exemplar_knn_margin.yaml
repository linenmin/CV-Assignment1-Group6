experiment_name: exp_023_ir101_adaface_haar_10ep_laststage_ft_exemplar_knn_margin

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: ir101
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_ir101_webface4m
  freeze_backbone: true
  unfreeze_last_stage: true
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 10
  learning_rate: 0.0003
  backbone_learning_rate: 0.00003
  weight_decay: 0.0001
  early_stopping_patience: 20

augmentation:
  use_horizontal_flip: false

inference:
  mode: exemplar_knn
  target_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  top_k_values: [1, 3, 5]
  margin_values: [0.00, 0.02, 0.04, 0.06, 0.08]
