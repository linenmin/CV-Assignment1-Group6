# ViT(exp_032) + IR101(exp_009) embedding：各分支 L2 后拼接再 L2，联合 1024 维空间 + neighborhood_aware + hflip TTA（对标 exp_047）
# 运行：python scripts/predict_embedding_concat_neighborhood.py --config configs/experiments/exp_055_vit_ir101_embedding_concat_neighborhood_fixed055_hfliptta.yaml

experiment_name: exp_055_vit_ir101_embedding_concat_neighborhood_fixed055_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: vit_base
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_vit_base_webface4m
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 0
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 1
  learning_rate: 0.0003
  backbone_learning_rate:
  weight_decay: 0.0001
  early_stopping_patience: 1

augmentation:
  use_horizontal_flip: false

embedding_concat_neighborhood:
  members:
    - name: vit032
      config_path: configs/experiments/exp_032_vit_adaface_haar_1ep_frozen_prototype_fixed055.yaml
      checkpoint_path: outputs/exp_032_vit_adaface_haar_1ep_frozen_prototype_fixed055/checkpoints/best.ckpt
    - name: ir101_009
      config_path: configs/experiments/exp_009_ir101_adaface_haar_10ep_laststage_ft.yaml
      checkpoint_path: outputs/exp_009_ir101_adaface_haar_10ep_laststage_ft/checkpoints/best.ckpt
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
