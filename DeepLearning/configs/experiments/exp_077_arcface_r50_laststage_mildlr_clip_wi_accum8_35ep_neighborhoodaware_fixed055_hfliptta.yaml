# exp_077：在 exp_073（last_stage + WI，loss 曲线最健康）基础上略降 LR + 梯度裁剪，
# 减轻早期震荡，略延长训练；推理仍与 060 同（threshold 0.55）。

experiment_name: exp_077_arcface_r50_laststage_mildlr_clip_wi_accum8_35ep_neighborhoodaware_fixed055_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face
  num_workers: 0

model:
  family: arcface_iresnet
  backbone_name: r50
  pretrained: false
  pretrained_checkpoint_path: models/pretrained/16backbone.pth
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 0
  iresnet_finetune_mode: last_stage
  dropout: 0.2
  weight_imprinting: true

train:
  batch_size: 8
  accumulate_grad_batches: 8
  max_epochs: 35
  learning_rate: 0.00015
  backbone_learning_rate: 0.00003
  weight_decay: 0.0001
  gradient_clip_val: 1.0
  monitor_metric: val_acc
  monitor_mode: max
  early_stopping_patience: 12
  scheduler: cosine
  accelerator: gpu
  devices: 1
  precision: 32

augmentation:
  use_horizontal_flip: true
  use_affine: true
  use_degradation_pack: false

inference:
  mode: neighborhood_aware
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
