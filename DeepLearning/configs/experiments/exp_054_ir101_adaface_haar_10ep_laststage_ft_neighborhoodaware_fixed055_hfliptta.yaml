# IR101 + hflip TTA + neighborhood_aware（对标 exp_047 的 ViT 版本）
# checkpoint 来自 exp_009

experiment_name: exp_054_ir101_adaface_haar_10ep_laststage_ft_neighborhoodaware_fixed055_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: ir101
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_ir101_webface4m
  freeze_backbone: true
  unfreeze_last_stage: true
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 10
  learning_rate: 0.0003
  backbone_learning_rate: 0.00003
  weight_decay: 0.0001
  early_stopping_patience: 20

augmentation:
  use_horizontal_flip: false

inference:
  mode: neighborhood_aware
  checkpoint_source_experiment: exp_009_ir101_adaface_haar_10ep_laststage_ft
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
