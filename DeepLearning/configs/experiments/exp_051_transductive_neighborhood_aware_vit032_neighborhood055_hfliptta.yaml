# 优先级 1 单独消融：单模型 exp_047 同款 neighborhood_aware + 仅 test 传导式簇精炼（无子中心、无双模型）。
# 权重来自 exp_032 best（无需在本实验目录下训练）；predict 时自动从 checkpoint_source_experiment 读 metrics.json。

experiment_name: exp_051_transductive_neighborhood_aware_vit032_neighborhood055_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: vit_base
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_vit_base_webface4m
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 0
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 1
  learning_rate: 0.0003
  backbone_learning_rate:
  weight_decay: 0.0001
  early_stopping_patience: 1

augmentation:
  use_horizontal_flip: false

inference:
  mode: transductive_neighborhood_aware
  checkpoint_source_experiment: exp_032_vit_adaface_haar_1ep_frozen_prototype_fixed055
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
  transductive_cluster:
    top_k_connect: 25
    sim_connect_threshold: 0.35
    min_cluster_size: 4
    weighted_vote_fraction: 0.72
