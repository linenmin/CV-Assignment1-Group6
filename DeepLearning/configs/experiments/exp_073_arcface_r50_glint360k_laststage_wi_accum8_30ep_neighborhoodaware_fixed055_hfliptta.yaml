# exp_073：经典「解冻最后一组 stage」微调 IResNet50（layer4 + bn2 + fc + features），
# 非仅 BN；CE + Weight Imprinting + 梯度累积；backbone 小 LR、head 较大 LR。
# 用于对比 ViT 难训：ResNet 卷积尾段可直接适配域特征。

experiment_name: exp_073_arcface_r50_glint360k_laststage_wi_accum8_30ep_neighborhoodaware_fixed055_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face
  num_workers: 0

model:
  family: arcface_iresnet
  backbone_name: r50
  pretrained: false
  pretrained_checkpoint_path: models/pretrained/16backbone.pth
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 0
  iresnet_finetune_mode: last_stage
  dropout: 0.2
  weight_imprinting: true

train:
  batch_size: 8
  accumulate_grad_batches: 8
  max_epochs: 30
  learning_rate: 0.0003
  backbone_learning_rate: 0.00005
  weight_decay: 0.0001
  monitor_metric: val_acc
  monitor_mode: max
  early_stopping_patience: 10
  scheduler: cosine
  accelerator: gpu
  devices: 1
  precision: 32

augmentation:
  use_horizontal_flip: true
  use_affine: true
  use_degradation_pack: false

inference:
  mode: neighborhood_aware
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
