experiment_name: exp_010_ir101_adaface_haar_10ep_laststage_ft_lr1e5

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: ir101
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_ir101_webface4m
  freeze_backbone: true
  unfreeze_last_stage: true
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 10
  learning_rate: 0.0003
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  early_stopping_patience: 20

augmentation:
  use_horizontal_flip: false
