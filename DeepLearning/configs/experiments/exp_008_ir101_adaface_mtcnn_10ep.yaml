experiment_name: exp_008_ir101_adaface_mtcnn_10ep

data:
  detector: mtcnn
  processed_dir: data/processed/exp_008_mtcnn_faces_112
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: ir101
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_ir101_webface4m
  freeze_backbone: true
  dropout: 0.2

train:
  batch_size: 16
  max_epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 20

augmentation:
  use_horizontal_flip: false
