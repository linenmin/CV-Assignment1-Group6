# exp_063：ViT + Triplet Margin Loss (Hard Negative Mining for look-alikes) + 解冻最后 2 个 block，
# 其它增强协议（水平翻转 + Affine）、推理与 exp_047 同款 neighborhood_aware + 固定 0.55 + HFlip TTA 保持一致。

experiment_name: exp_063_vit_adaface_haar_20ep_last2block_triplet_neighborhoodaware_fixed055_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face
  num_workers: 0
  use_triplet_dataset: true
  lookalike_csv_path: reports/analysis/exp_029_other_k2/other_cluster_assignments.csv

model:
  family: cvlface
  backbone_name: vit_base
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_vit_base_webface4m
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 2
  unfreeze_cvlface_norm: true
  unfreeze_cvlface_feature: true
  dropout: 0.2
  loss_name: triplet

train:
  batch_size: 8
  max_epochs: 20
  learning_rate: 0.0003
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  monitor_metric: train_loss # Validation lacks useful metrics when pure triplet Backbone
  monitor_mode: min
  early_stopping_patience: 6
  scheduler: cosine

augmentation:
  use_horizontal_flip: true
  use_affine: true
  use_degradation_pack: false

inference:
  mode: neighborhood_aware
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
