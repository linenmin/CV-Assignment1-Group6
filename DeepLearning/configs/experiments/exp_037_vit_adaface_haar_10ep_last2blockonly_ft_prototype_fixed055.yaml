experiment_name: exp_037_vit_adaface_haar_10ep_last2blockonly_ft_prototype_fixed055

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: vit_base
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_vit_base_webface4m
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 2
  unfreeze_cvlface_norm: false
  unfreeze_cvlface_feature: false
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 10
  learning_rate: 0.0003
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  early_stopping_patience: 20

augmentation:
  use_horizontal_flip: false

inference:
  mode: prototype
  prototype_labels: [1, 2]
  other_label: 0
  threshold_values: [0.55]
