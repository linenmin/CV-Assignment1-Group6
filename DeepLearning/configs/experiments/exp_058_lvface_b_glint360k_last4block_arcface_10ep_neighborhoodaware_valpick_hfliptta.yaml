# LVFace-B：解冻最后 4 个 ViT block + ArcFace（仅类 1/2）微调，推理时与 exp_057 同款验证集阈值搜索。

experiment_name: exp_058_lvface_b_glint360k_last4block_arcface_10ep_neighborhoodaware_valpick_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: lvface
  backbone_name: vit_b_dp005_mask_005
  pretrained: false
  pretrained_checkpoint_path: models/pretrained/LVFace-B_Glint360K.pt
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 4
  unfreeze_cvlface_norm: false
  unfreeze_cvlface_feature: false
  dropout: 0.2

loss:
  name: arcface
  target_labels: [1, 2]
  arcface_scale: 30.0
  arcface_margin: 0.5

train:
  batch_size: 8
  max_epochs: 10
  learning_rate: 0.0003
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  monitor_metric: val_target_acc
  monitor_mode: max
  early_stopping_patience: 4
  scheduler: cosine

augmentation:
  use_horizontal_flip: false

inference:
  mode: neighborhood_aware
  prototype_labels: [1, 2]
  other_label: 0
  threshold: 0.35
  threshold_values:
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.45
    - 0.50
    - 0.55
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
