# exp_062（方向 C）：复用 exp_061 权重；邻居 argmax 一致性驱动的自适应阈值 [th_min, th_max]；
# 可选一轮高置信测试伪标签并入 gallery 后重算 prototype 再推理。
# predict 时从 checkpoint_source_experiment 读 metrics.json。

experiment_name: exp_062_vit061_adaptive_neighborhood_pseudo2_hfliptta

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face
  num_workers: 0

model:
  family: cvlface
  backbone_name: vit_base
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_vit_base_webface4m
  freeze_backbone: true
  unfreeze_last_stage: false
  unfreeze_stage_count: 2
  unfreeze_cvlface_norm: true
  unfreeze_cvlface_feature: true
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 1
  learning_rate: 0.0003
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  early_stopping_patience: 1

augmentation:
  use_horizontal_flip: false

inference:
  mode: adaptive_neighborhood_aware
  checkpoint_source_experiment: exp_061_vit_adaface_haar_20ep_last2block_ce_neighborhoodaware_fixed055_hfliptta
  prototype_labels: [1, 2]
  other_label: 0
  tta_horizontal_flip: true
  neighborhood_aware:
    top_k: 15
    base_weight: 0.5
  adaptive_threshold:
    th_min: 0.45
    th_max: 0.65
  pseudo_label_refinement:
    enabled: true
    min_final_score: 0.72
    max_rounds: 2
