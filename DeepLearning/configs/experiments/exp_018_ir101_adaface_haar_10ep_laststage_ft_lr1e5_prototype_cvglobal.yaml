experiment_name: exp_018_ir101_adaface_haar_10ep_laststage_ft_lr1e5_prototype_cvglobal

data:
  detector: haar
  processed_dir: data/processed/exp_001_faces_224
  splits_dir: data/splits/exp_001
  face_size: 112
  normalization: face

model:
  family: cvlface
  backbone_name: ir101
  pretrained: true
  pretrained_repo_id: minchul/cvlface_adaface_ir101_webface4m
  freeze_backbone: true
  unfreeze_last_stage: true
  dropout: 0.2

train:
  batch_size: 8
  max_epochs: 10
  learning_rate: 0.0003
  backbone_learning_rate: 0.00001
  weight_decay: 0.0001
  early_stopping_patience: 20

augmentation:
  use_horizontal_flip: false

inference:
  mode: prototype
  prototype_labels: [1, 2]
  other_label: 0
  threshold_selection: crossval_global
  crossval_splits: 4
  crossval_random_state: 42
  threshold_values:
    - 0.45
    - 0.46
    - 0.47
    - 0.48
    - 0.49
    - 0.50
    - 0.51
    - 0.52
    - 0.53
