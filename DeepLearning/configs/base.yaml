experiment_name: base_experiment
seed: 42

data:
  raw_dir: data/raw/kul-computer-vision-ga-1-2026
  processed_dir: data/processed/faces_224
  splits_dir: data/splits/default
  submissions_dir: data/submissions
  detector_cache_dir: data/interim/detectors
  face_size: 224
  val_ratio: 0.2
  num_workers: 4
  detector: haar
  normalization: imagenet

model:
  family: timm
  backbone_name: resnet18
  pretrained: true
  dropout: 0.2
  pretrained_repo_id:
  pretrained_checkpoint_path:
  freeze_backbone: false
  unfreeze_last_stage: false
  unfreeze_stage_count: 0

train:
  batch_size: 16
  max_epochs: 8
  learning_rate: 0.0003
  backbone_learning_rate:
  weight_decay: 0.0001
  monitor_metric: val_acc
  monitor_mode:
  accelerator: auto
  devices: 1
  precision: 32
  early_stopping_patience: 3
  scheduler: cosine

augmentation:
  use_horizontal_flip: true
  use_affine: false
  use_degradation_pack: false
